spring.application.name=test

# ===============================
# Server
# ===============================
server.port=9090

# ===============================
# Logging
# ===============================
logging.file.name=logs/app.log
logging.level.root=INFO
logging.level.com.example.demo=DEBUG

# ===============================
# Dummy Payment Config (Local Run)
# ===============================
payment.default.type=DUMMY
payment.params.bank_account_number=0000000000
payment.params.bank_ifsc_code=TEST0000001
payment.params.bank_account_name=TEST_ACCOUNT
payment.params.bank_name=TEST_BANK

# ===============================
# Disable Database (Local Run)
# ===============================
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration





