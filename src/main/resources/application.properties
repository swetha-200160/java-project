# ===============================
# App
# ===============================
spring.application.name=test

# ===============================
# Server
# ===============================
server.port=9090

# ===============================
# Logging
# ===============================
logging.file.name=logs/app.log
logging.level.root=INFO
logging.level.com.example=DEBUG

# ===============================
# Disable DB for TEST
# ===============================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

spring.jpa.repositories.enabled=false

# ===============================
# Dummy Payment Config
# ===============================
payment.default.type=DUMMY
payment.params.bank_account_number=0000000000
payment.params.bank_ifsc_code=TEST0000001
payment.params.bank_account_name=TEST_ACCOUNT
payment.params.currency=INR
payment.params.bank_code=TEST_BANK